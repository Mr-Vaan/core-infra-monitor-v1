version: '3.8'

services:
  # Nginx SSL Proxy (Membuka port 80 & 443)
  proxy:
    image: nginx:alpine
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: ingress
      - target: 443
        published: 443
        protocol: tcp
        mode: ingress
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    networks:
      - infra-overlay-net
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s

  # Aplikasi Backend (3 Replika High Availability)
  app:
    image: ivandhebel/core-infra-monitor-v1:latest
    environment:
      - NODE_ENV=production
      - PORT=3000
    networks:
      - infra-overlay-net
    deploy:
      mode: replicated
      replicas: 3
      endpoint_mode: vip
      restart_policy:
        condition: on-failure
        delay: 5s

networks:
  infra-overlay-net:
    driver: overlay
    attachable: true
